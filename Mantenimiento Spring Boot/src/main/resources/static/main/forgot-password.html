<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password | Re-Vibe</title>
    <link rel="icon" href="../assets/img/logo/revibes.png">
    <link rel="stylesheet" href="../css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../css/styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2>Recuperar Contraseña</h2>
                <p>Por favor, introduce tu correo electrónico. Te enviaremos un enlace para restablecer tu contraseña.</p>
                <form action="submit-forgot-password.html" method="POST">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" placeholder="correo@mail.com" class="form-control mb-2" id="email" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar enlace de recuperación</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
