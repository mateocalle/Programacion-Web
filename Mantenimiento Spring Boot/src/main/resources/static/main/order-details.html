<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Orden - Re-Vibe</title>
    <link rel="icon" href="../assets/img/logo/revibes.png">
    <link rel="stylesheet" href="../css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../css/styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div class="container mt-4" id="order-details">
    <img src="../assets/img/logo/revibes.png" alt="logo" style="height: 100px">
    <h4 id="order-id">ID de la Orden: #0000001</h4>
    <p id="order-date"><strong>Fecha de la Orden:</strong> 18/05/2024 15:53</p>
    <p id="order-status"><strong>Estado de la Orden: </strong>Procesando</p>
    <div class="col-sm-3">
        <div class="card">
            <img src="https://http2.mlstatic.com/D_NQ_NP_900745-MLM75936460107_042024-O.webp"
                 class="card-img-top" alt="Product name">
            <div class="card-body">
                <h5 class="card-title">Product name</h5>
                <p class="card-text">Product price</p>
            </div>
        </div>
    </div>
    <p id="order-total"><strong>Total de la Orden: </strong> $0.00</p>
</div>
<script src="details.js"></script>
</body>
</html>
